plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = file("${rootProject.projectDir}/local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')

def flutterEngineVersion = '1.0.0-42d3d75a56efe1a2e9902f52dc8006099c45d937'
if (flutterSdkPath != null) {
    def engineStampFile = file("${flutterSdkPath}/bin/cache/engine.stamp")
    if (engineStampFile.exists()) {
        flutterEngineVersion = "1.0.0-${engineStampFile.text.trim()}"
    }
}

android {
    namespace 'com.budgetbuddy.app'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.budgetbuddy.app'
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
        }
    }

    lint {
        disable 'MissingDimensionActivityClassName'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    debugApi "io.flutter:flutter_embedding_debug:$flutterEngineVersion"
    profileApi "io.flutter:flutter_embedding_profile:$flutterEngineVersion"
    releaseApi "io.flutter:flutter_embedding_release:$flutterEngineVersion"
}

flutter {
    source '../..'
}
